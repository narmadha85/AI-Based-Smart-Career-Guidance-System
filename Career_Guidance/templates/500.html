{% extends "base.html" %}

{% block title %}Server Error (500) - CareerAI{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 1.5rem; text-align: center;">
    <div style="font-size: 4rem; margin-bottom: 1rem;">⚠️ 500</div>
    <h1 style="font-size: 2.2rem; margin-bottom: 0.75rem;">Internal Server Error</h1>
    <p style="font-size: 1.1rem; max-width: 500px; margin: 0 auto 2rem;">
        An unexpected error occurred while processing your request. Please try submitting the assessment again.
    </p>
    <a href="{{ url_for('assess') }}" class="btn btn-primary">Try Assessment Again</a>
</div>
{% endblock %}
